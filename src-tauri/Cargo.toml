[package]
name = "acidanthera"
version = "0.1.0"
description = "A local-first, vim-first markdown notes app with a built-in coding agent."
authors = ["Octavio Cossy Torquati"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Octaviocossy/acidanthera"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "acidanthera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
tauri-plugin-dialog = "2"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
toml = "1"
toml_edit = "0.25"
trash = "5"

[lints.clippy]
# `priority = -1` lets the individually named lints below override the group.
all = { level = "deny", priority = -1 }
# Moved to `nursery` upstream, so it is NOT in `clippy::all` — naming it is the only way to get it.
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
